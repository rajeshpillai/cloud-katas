<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Cloud Katas</title>
    <script>
      // SPA GitHub Pages router: a request for /cloud-katas/modules/foo
      // hits this 404, then we redirect to /cloud-katas/?/modules/foo so
      // index.html can decode it and React Router can render the route.
      // segmentCount = number of path levels in BASE_URL after the host
      // (1 for "/cloud-katas/").
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + segmentCount)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(segmentCount)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
