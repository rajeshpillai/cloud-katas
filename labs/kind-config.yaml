# kind cluster used by the Kubernetes-based Cloud Katas labs (Docker & K8s
# Basics, GKE, EKS, Argo CD, Debugging). Created by ../labs/lab.sh up.
#
# - containerd is told that "localhost:5001" is the local registry started by
#   docker-compose, so `kubectl apply` can pull images you pushed there.
# - extraPortMappings exposes a NodePort range on localhost so a Service of
#   type NodePort (or `kubectl port-forward`) is reachable from the host the
#   same way a cloud LoadBalancer would be.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry.mirrors."localhost:5001"]
      endpoint = ["http://katas-registry:5000"]
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
